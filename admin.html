<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="admin-layout">
        <aside class="sidebar">     
            <div>
                <h2>Admin Dashboard</h2>
                <p>Retail System</p>
            </div>
        </aside> 
        <!-- aside represent the portion of doc that is indirectly related to main content -->
        <main class="admin-main">
            <header>
                <h2>Inventory Overview</h2>
                <p style="color:var(--text-secondary);">Real-time tracking and management</p>
                <!-- color which define in css is call here by use var()function  -->
            </header>
            <section class="table-container">
                <div style="padding: 1rem 1.5rem; border-bottom:1px solid var(--border);">
                    <h3 style="font-size: 1rem;">Recent Inventory</h3>
                </div>
                <table>
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Product Name</th>
                            <th>SKU</th>
                            <th>Category</th>
                            <th>Price</th>
                            <th>Stock Level</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="admin-tbody"></tbody>
                </table>
            </section>
        </main>

    </div>
    <dialog id="edit-modal">
        <h3 style="margin-bottom: 1.5rem;">Edit Inventory Item</h3>
        <form id="edit-form" class="form-grid" style="margin-top:0;">
            <input type="hidden" id="edit-id">
            
            <div class="input-group full-width">
                <label>Item Name</label>
                <input type="text" id="edit-name" required>
            </div>
            <div class="input-group">
                <label>Price ($)</label>
                <input type="number" step="0.01" id="edit-price" required>
            </div>
            <div class="input-group">
                <label>Quantity</label>
                <input type="number" id="edit-stock" required>
            </div>
            <div class="input-group full-width" style="flex-direction: row; justify-content: flex-end; gap: 1rem; margin-top: 1rem;">
                <button type="button" class="btn-outline" onclick="document.getElementById('edit-modal').close()">Cancel</button>
                <button type="submit" class="btn-primary">Save Changes</button>
            </div>
        </form>
    </dialog>
    <script src="admin.js"></script>
</body>
</html>
